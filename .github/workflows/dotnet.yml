name: .NET quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore CareFlow.sln

      - name: Build
        run: dotnet build CareFlow.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test CareFlow.sln -c Release --no-build --nologo
